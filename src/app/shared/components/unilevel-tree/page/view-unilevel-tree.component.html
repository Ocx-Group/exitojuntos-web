<section class="section client-dashboard">
  <ul class="breadcrumb breadcrumb-style">
    <li class="breadcrumb-item">
      <h5 class="page-title m-b-0">
        {{ 'MY-NETWORK-PAGE.TITLE.TEXT' | translate }}
      </h5>
    </li>
    <li class="breadcrumb-item bcrumb-1">
      <a routerLink="/app/my-network"><i class="fas fa-network-wired font-17"></i></a>
    </li>
    <li class="breadcrumb-item">
      {{ 'MY-NETWORK-PAGE.NETWORK-TREES.TEXT' | translate }}
    </li>
  </ul>

  <div class="section-body">
    <!-- Árbol Unilevel -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <div class="d-flex justify-content-between align-items-center w-100">
              <h5 class="mb-0">
                <i class="fas fa-project-diagram me-2"></i>
                {{ 'MY-NETWORK-PAGE.UNILEVEL-MODEL.TEXT' | translate }}
              </h5>
              <div class="d-flex gap-2">
                <button type="button" routerLink="/app/my-network" class="btn btn-gold-outline btn-sm">
                  <i class="fas fa-arrow-left me-1"></i>
                  {{ 'MY-NETWORK-PAGE.BACK.TEXT' | translate }}
                </button>
              </div>
            </div>
          </div>

          <div class="card-body p-3">
            <!-- Loading State -->
            <div *ngIf="loading()" class="text-center py-5">
              <output class="spinner-border text-warning mb-3">
                <span class="visually-hidden">Cargando...</span>
              </output>
              <p class="text-muted">Cargando árbol de red...</p>
            </div>

            <!-- Tree Content -->
            <div *ngIf="showDiv && !loading()" class="tree-wrapper">
              <app-client-unilevel-tree-component [nodeTemplate]="nodeTemplate" [data]="tree"
                (loadFamilyTree)="onloadFamilyTree($event)">
              </app-client-unilevel-tree-component>

              <ng-template #nodeTemplate let-node>
                <div class="chart-node" style="position: relative;">
                  <button class="node-click-area" (click)="onNodeClick(node, $event)" type="button"
                    title="Cargar árbol desde este nodo"
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; border: none; cursor: pointer; z-index: 1;">
                    <span class="visually-hidden">Cargar árbol de {{ node.phone || 'Usuario ' + node.id }}</span>
                  </button>
                  <img title="Usuario" alt="node" [src]="node.imageProfileUrl || 'assets/images/user.png'"
                    class="node-image" style="position: relative; z-index: 2; pointer-events: none;" />
                  <div class="name" style="position: relative; z-index: 2; pointer-events: none;">
                    <span class="user-name">
                      {{ node.phone || 'Usuario ' + node.id }}
                    </span>
                  </div>
                  <button *ngIf="node.children && node.children.length" (click)="toggleChildren(node, $event)"
                    (keypress)="node.hideChildren = !node.hideChildren" class="tree-fold-btn" type="button"
                    title="Expandir/Contraer" style="position: relative; z-index: 3;">
                    {{ node.hideChildren ? '+' : '-' }}
                  </button>
                </div>
              </ng-template>
            </div>

            <!-- Empty State -->
            <div *ngIf="!showDiv && !loading()" class="text-center py-5">
              <i class="fas fa-project-diagram fa-3x text-muted mb-3"></i>
              <p class="text-muted">No hay datos disponibles para mostrar</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
