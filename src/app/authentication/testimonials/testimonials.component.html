<section class="testimonials-page">

  <div class="page-glow page-glow--left"></div>
  <div class="page-glow page-glow--right"></div>

  <div class="page-container">

    <!-- Header -->
    <div class="page-header">
      <p class="section-tag">Casos de Éxito</p>
      <h1 class="page-title">Lo que dicen<br><span class="text-gradient">nuestros miembros</span></h1>
      <p class="page-description">
        Historias reales de personas que transformaron su vida financiera con Éxito Juntos
      </p>
    </div>

    <!-- Cards grid -->
    <div class="testimonials-grid">
      @for (t of testimonials; track t.id) {
        <div class="testimonial-card">

          <div class="card-top">
            <div class="quote-icon">
              <i class="bi bi-chat-quote-fill"></i>
            </div>
            <div class="card-stars">
              @for (s of getStars(t.stars); track s) {
                <i class="bi bi-star-fill star"></i>
              }
            </div>
          </div>

          <p class="card-quote">"{{ t.quote }}"</p>

          <div class="card-author">
            <img [src]="t.avatar || 'assets/images/user.png'" [alt]="t.name" class="author-avatar" />
            <div class="author-info">
              <p class="author-name">{{ t.name }}</p>
              <p class="author-role">{{ t.role }}</p>
            </div>
          </div>

        </div>
      }
    </div>

  </div>
</section>
